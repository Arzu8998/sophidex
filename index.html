<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sophidex</title>
<meta name="description" content="Felsefe tarihindeki filozofları, akımları ve kavramları arayıp özetini ve aralarındaki bağları gösteren uygulama.">
<meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sophidex">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="simgeler/simge.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="simgeler/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
/* Düzen: solda arama ve sonuç listesi, sağda seçili fikrin özeti ve bağ haritası; telefonda alt alta. */
:root {
  --bg: #F4F6F9;
  --surface: #FFFFFF;
  --sunk: #EBEEF3;
  --ink: #1A2130;
  --muted: #5A6476;
  --line: #D9DEE6;
  --filozof: #2B4C9E;
  --akim: #A8690F;
  --kavram: #23786A;
  --catisma: #B23F35;
  --mark: #FBE7A6;
  --f-display: "Spectral", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141B; --surface: #181D27; --sunk: #0D1016; --ink: #E5E8EE; --muted: #98A1B3; --line: #2A3140;
    --filozof: #8EA7EE; --akim: #E2A94E; --kavram: #5EC4A8; --catisma: #E8837A; --mark: #5B4A12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141B; --surface: #181D27; --sunk: #0D1016; --ink: #E5E8EE; --muted: #98A1B3; --line: #2A3140;
  --filozof: #8EA7EE; --akim: #E2A94E; --kavram: #5EC4A8; --catisma: #E8837A; --mark: #5B4A12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1240px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding-block: 28px 18px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 2rem; letter-spacing: -0.01em; margin: 0; cursor: pointer; }
.brand p { margin: 0; color: var(--muted); font-size: .92rem; }
.stats { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.stats b { color: var(--ink); font-weight: 500; }

.layout { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 28px; padding-top: 20px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* Sol sütun */
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (max-width: 820px) { .side { position: static; } }
.search { position: relative; }
.search input {
  width: 100%; font: inherit; font-size: 1.02rem; padding: 12px 40px 12px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.search input:focus { outline: 2px solid var(--filozof); outline-offset: 1px; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.search button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.search button:focus-visible { outline: 2px solid var(--filozof); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: .82rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 4px 10px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible { outline: 2px solid var(--filozof); outline-offset: 1px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.f { background: var(--filozof); } .dot.a { background: var(--akim); } .dot.k { background: var(--kavram); }
select.era { font: inherit; font-size: .85rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.hint { color: var(--muted); font-size: .84rem; margin: 0; }
.hint button { font: inherit; border: 0; background: none; color: var(--filozof); padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.results { list-style: none; margin: 0; padding: 0; max-height: calc(100vh - 260px); overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
@media (max-width: 820px) { .results { max-height: 340px; } }
.results li + li { border-top: 1px solid var(--line); }
.results button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 10px 12px; cursor: pointer; }
.results button:hover { background: var(--sunk); }
.results button:focus-visible { outline: 2px solid var(--filozof); outline-offset: -2px; }
.results button[aria-current="true"] { background: var(--sunk); box-shadow: inset 3px 0 0 var(--filozof); }
.r-top { display: flex; align-items: center; gap: 8px; }
.r-name { font-weight: 600; }
.r-meta { margin-left: auto; font-family: var(--f-mono); font-size: .72rem; color: var(--muted); white-space: nowrap; }
.r-snip { font-size: .84rem; color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.empty { padding: 16px; color: var(--muted); font-size: .9rem; }

/* Sağ sütun */
main { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px clamp(16px, 3vw, 32px); }
.eyebrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.eyebrow .t-f { color: var(--filozof); } .eyebrow .t-a { color: var(--akim); } .eyebrow .t-k { color: var(--kavram); }
h2.title { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.12; margin: 8px 0 4px; text-wrap: balance; }
.aliases { color: var(--muted); font-size: .9rem; margin: 0 0 4px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 20px; font-family: var(--f-mono); font-size: .8rem; color: var(--muted); margin: 10px 0 0; }
.facts span b { color: var(--ink); font-weight: 500; }
.summary { font-family: var(--f-display); font-size: 1.2rem; line-height: 1.55; margin: 18px 0 0; max-width: 68ch; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; margin-top: 24px; }
@media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr); } }
h3.sec { font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
ul.ideas { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; max-width: 65ch; }
ul.works { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-style: italic; font-family: var(--f-display); font-size: 1.02rem; }
.links { display: flex; flex-direction: column; gap: 14px; }
.links h4 { margin: 0 0 6px; font-size: .86rem; font-weight: 600; }
.links .row { display: flex; flex-wrap: wrap; gap: 6px; }
.link-chip { font: inherit; font-size: .84rem; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 3px 10px 3px 8px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.link-chip:hover { border-color: var(--muted); }
.link-chip:focus-visible { outline: 2px solid var(--filozof); outline-offset: 1px; }
.link-chip.conflict { border-style: dashed; border-color: var(--catisma); }

.graph-box { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 20px; }
.graph-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: baseline; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--muted); }
.legend i.c { border-top: 2px dashed var(--catisma); }
.legend i.m { border-top: 1.5px solid var(--line); }
.legend i.r { border-top: 2px dotted var(--kavram); }
.graph-scroll { overflow-x: auto; margin-top: 10px; }
svg.graph { display: block; width: 100%; min-width: 640px; height: auto; }
svg.graph .node { cursor: pointer; }
svg.graph .node:focus { outline: none; }
svg.graph .node:focus-visible circle, svg.graph .node:hover circle { stroke: var(--ink); stroke-width: 2.5; }
svg.graph text { font-family: var(--f-body); font-size: 13.5px; fill: var(--ink); }
svg.graph .center-label { font-family: var(--f-display); font-size: 19px; font-weight: 600; }
svg.graph .edge { fill: none; }
.overview h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.7rem; margin: 0 0 6px; }
.overview > p { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
.eras { display: flex; flex-direction: column; }
.era { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
@media (max-width: 600px) { .era { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.era-name { font-family: var(--f-display); font-weight: 600; font-size: 1.08rem; line-height: 1.25; }
.era-range { font-family: var(--f-mono); font-size: .74rem; color: var(--muted); }
.era .row { display: flex; flex-wrap: wrap; gap: 6px; }
.topic-stats { font-size: .95rem; margin: 10px 0 0; color: var(--muted); }
.topic-list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.topic-list button { all: unset; box-sizing: border-box; cursor: pointer; display: block; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.topic-list button:hover { border-color: var(--muted); }
.topic-list button:focus-visible { outline: 2px solid var(--filozof); }
.topic-list .r-snip { -webkit-line-clamp: 3; }
/* Görünüm sekmeleri */
.views { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.views a { font-size: .86rem; font-weight: 500; color: var(--muted); text-decoration: none; padding: 5px 14px; border-radius: 999px; }
.views a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.views a:focus-visible { outline: 2px solid var(--filozof); outline-offset: 1px; }
.soy-modu .layout { grid-template-columns: minmax(0, 1fr); }
.soy-modu .side { display: none; }

/* Ayrıntı sayfasında temel düşünce */
.core { margin-top: 18px; padding: 14px 16px; border-left: 3px solid var(--filozof); background: var(--bg); border-radius: 0 10px 10px 0; max-width: 72ch; }
.core h3 { margin: 0 0 4px; }
.core p { margin: 0; }
.core .yeni { margin-top: 8px; font-size: .92rem; }
.core a { display: inline-block; margin-top: 10px; font-size: .88rem; color: var(--filozof); font-weight: 500; }

/* Soy ağacı: dikey zaman ekseni, solda etki yayları */
.soy-card h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.7rem; margin: 0 0 6px; }
.soy-card > p { color: var(--muted); margin: 0 0 14px; max-width: 72ch; }
.soy-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.soy-bar select { font: inherit; font-size: .85rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.soy-bar .chip[disabled] { opacity: .45; cursor: default; }
@media (max-width: 600px) { .soy-bar select { flex: 1 1 40%; min-width: 0; } }
/* Seçili düşünür satırı kaydırırken üstte kalır. */
.soy-durum {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--surface);
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: .86rem; color: var(--muted);
  margin: 10px calc(-1 * clamp(16px, 3vw, 32px)) 0; padding: 8px clamp(16px, 3vw, 32px); border-bottom: 1px solid var(--line);
}
.soy-durum b { color: var(--ink); font-family: var(--f-display); font-size: 1.02rem; }
.soy-durum .ust { color: var(--akim); font-weight: 600; } .soy-durum .alt { color: var(--kavram); font-weight: 600; }
.soy-durum button { margin-left: auto; }
.soy-durum:empty { display: none; }
.soy-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--muted); margin: 10px 0 0; }
.soy-legend span { display: inline-flex; align-items: center; gap: 6px; }
.soy-legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--filozof); }
.soy-legend i.h { border-top: 2.5px solid var(--ink); }
.soy-legend i.a { border-top: 2px solid var(--akim); }
.soy-legend i.t { border-top: 2px solid var(--kavram); }
.soy { position: relative; --g: 58px; margin-top: 6px; }
@media (max-width: 600px) { .soy { --g: 34px; } }
.soy svg.yaylar { position: absolute; left: 0; top: 0; width: var(--g); overflow: visible; pointer-events: none; }
.yay { fill: none; stroke: var(--muted); stroke-width: 1; opacity: .28; }
.yay.h { stroke-width: 1.6; }
.soy.odak .yay { opacity: .08; }
.soy.odak .yay.ust { stroke: var(--akim); opacity: .9; stroke-width: 1.6; }
.soy.odak .yay.alt { stroke: var(--kavram); opacity: .9; stroke-width: 1.6; }
.soy.odak .yay.dog { stroke-width: 2.6; opacity: 1; }
.yaylar circle { fill: var(--surface); stroke: var(--filozof); stroke-width: 2; }
.soy.odak .yaylar circle { opacity: .35; }
.soy.odak .yaylar circle.in { opacity: 1; }
.yaylar circle.sec { fill: var(--filozof); }
.sk-liste { list-style: none; margin: 0; padding: 0 0 0 calc(var(--g) + 6px); }
.sk-yy { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 18px 0 6px; }
.sk { padding: 12px 14px; margin: 0 0 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); cursor: pointer; scroll-margin-top: 64px; transition: opacity .15s; }
.sk:hover { border-color: var(--muted); }
.soy.odak .sk { opacity: .42; }
.soy.odak .sk.in { opacity: 1; }
.soy.odak.yalniz .sk:not(.in), .soy.odak.yalniz .sk-yy.bos { display: none; }
.sk.ust { border-color: var(--akim); }
.sk.alt { border-color: var(--kavram); }
.sk.sec { border-color: var(--filozof); box-shadow: 0 0 0 2px var(--filozof); background: var(--surface); }
.sk-ust { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.sk-ad { all: unset; cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; line-height: 1.25; }
.sk-ad:focus-visible { outline: 2px solid var(--filozof); outline-offset: 2px; border-radius: 4px; }
.sk-meta { font-family: var(--f-mono); font-size: .74rem; color: var(--muted); }
.sk-rol { font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.sk.ust .sk-rol { color: var(--akim); } .sk.alt .sk-rol { color: var(--kavram); } .sk.sec .sk-rol { color: var(--filozof); }
.sk-satir { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 2px 10px; margin-top: 6px; font-size: .88rem; align-items: baseline; }
@media (max-width: 600px) { .sk-satir { grid-template-columns: minmax(0, 1fr); } .sk { padding: 10px 12px; scroll-margin-top: 84px; } }
.sk-et { font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.sk-yeni { font-weight: 500; }
.sk-oz { margin: 8px 0 0; font-family: var(--f-display); font-size: 1.02rem; line-height: 1.5; max-width: 75ch; }
.soy.ozsuz .sk-oz { display: none; }
.sk-cips { display: flex; flex-wrap: wrap; gap: 4px; }
.sk-cips .yok { color: var(--muted); font-style: italic; }
.sk-git { font: inherit; font-size: .8rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 1px 9px; border-radius: 999px; cursor: pointer; }
.sk-git:hover { border-color: var(--muted); }
.sk-git:focus-visible { outline: 2px solid var(--filozof); outline-offset: 1px; }
.sk-git.h { border-color: var(--ink); font-weight: 600; }
.sk-git.c { border-style: dashed; border-color: var(--catisma); }
.sk-detay { all: unset; cursor: pointer; display: inline-block; margin-top: 8px; font-size: .84rem; color: var(--filozof); font-weight: 500; }
.sk-detay:focus-visible { outline: 2px solid var(--filozof); outline-offset: 2px; border-radius: 4px; }
footer { margin-top: 28px; color: var(--muted); font-size: .8rem; }
@media (prefers-reduced-motion: no-preference) { .card { animation: in .25s ease-out; } @keyframes in { from { transform: translateY(4px); } to { transform: none; } } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="home" tabindex="0" role="link" aria-label="Sophidex ana sayfa">Sophidex</h1>
      <p>Thales'ten Butler'a fikirler, akımlar ve aralarındaki bağlar</p>
    </div>
    <nav class="views" aria-label="Görünüm">
      <a href="#" id="v-atlas" aria-current="page">Atlas</a>
      <a href="#soy" id="v-soy">Soy ağacı</a>
    </nav>
    <div class="stats" id="stats">Yükleniyor…</div>
  </header>

  <div class="layout">
    <aside class="side">
      <div class="search">
        <label for="q" class="hint" style="display:block;margin-bottom:6px">Anahtar kelime, filozof, akım ya da kavram ara</label>
        <input id="q" type="search" autocomplete="off" placeholder="ör. özgürlük, Kant, varoluşçuluk, nedensellik" aria-describedby="examples">
        <button id="clear" type="button" aria-label="Aramayı temizle" hidden>×</button>
      </div>
      <p class="hint" id="examples">Örnekler: <button data-q="özgürlük">özgürlük</button>, <button data-q="adalet">adalet</button>, <button data-q="ruh">ruh</button>, <button data-q="Gazali">Gazâlî</button>, <button data-q="diyalektik">diyalektik</button></p>
      <div class="filters" role="group" aria-label="Tür süzgeci">
        <button class="chip" data-t="" aria-pressed="true">Tümü</button>
        <button class="chip" data-t="f" aria-pressed="false"><span class="dot f"></span>Filozoflar</button>
        <button class="chip" data-t="a" aria-pressed="false"><span class="dot a"></span>Akımlar</button>
        <button class="chip" data-t="k" aria-pressed="false"><span class="dot k"></span>Kavramlar</button>
      </div>
      <label for="era" class="hint">Dönem</label>
      <select id="era" class="era"></select>
      <p class="hint" id="count" aria-live="polite"></p>
      <ul class="results" id="results"></ul>
    </aside>

    <main id="main" tabindex="-1"></main>
  </div>
  <footer>Özetler genel başvuru içindir; tarihler yaklaşık olabilir. Kayıtlar ve bağlar <code>veri.json</code> dosyasından okunur.</footer>
</div>

<script>
(function () {
  "use strict";
  var DONEMLER = [
    ["dogu", "Doğu Düşüncesi", "MÖ 6. yy – MS 8. yy"],
    ["antik", "Antik Yunan", "MÖ 6. – 4. yy"],
    ["helenistik", "Helenistik ve Roma", "MÖ 4. yy – MS 3. yy"],

    ["modern", "Erken Modern", "17. yy"],
    ["aydinlanma", "Aydınlanma", "18. yy"],
    ["ondokuz", "19. Yüzyıl", "1800 – 1900"],
    ["yirmi", "20. Yüzyıl ve Günümüz", "1900 –"]
  ];
  var DONEM = {}; DONEMLER.forEach(function (d, i) { DONEM[d[0]] = { ad: d[1], aralik: d[2], sira: i }; });
  var TUR = { f: "Filozof", a: "Akım", k: "Kavram" };

  var V = {}, LISTE = [], KOMSU = {}, durum = { q: "", t: "", e: "", secili: null };

  function norm(s) {
    return (s || "").toLocaleLowerCase("tr-TR")
      .replace(/[âà]/g, "a").replace(/[îı]/g, "i").replace(/[ûü]/g, "u")
      .replace(/ç/g, "c").replace(/ğ/g, "g").replace(/ö/g, "o").replace(/ş/g, "s")

  // Normalleştirilmiş metinde bulunan eşleşmeyi özgün metinde işaretler (harf sayısı korunur varsayımıyla).
  function isaretle(metin, terimler) {
    var n = norm(metin);
    if (n.length !== metin.length) return esc(metin);
    var araliklar = [];
    terimler.forEach(function (t) {
      if (!t) return;
      var i = n.indexOf(t);
      while (i !== -1) { araliklar.push([i, i + t.length]); i = n.indexOf(t, i + t.length); }
    });
    if (!araliklar.length) return esc(metin);
    araliklar.sort(function (a, b) { return a[0] - b[0]; });
    var out = "", son = 0;
    araliklar.forEach(function (r) {
      if (r[0] < son) return;
      out += esc(metin.slice(son, r[0])) + "<mark>" + esc(metin.slice(r[0], r[1])) + "</mark>";
      son = r[1];
    });
    return out + esc(metin.slice(son));
  }
  function ilkCumle(s) { var m = s.match(/^.*?[.!?](\s|$)/); return m ? m[0].trim() : s; }
  function eslesenCumle(v, terimler) {
    var parcalar = [v.s].concat(v.i || []);
    var cumleler = [];
    parcalar.forEach(function (p) { (p.match(/[^.!?]+[.!?]?/g) || [p]).forEach(function (c) { cumleler.push(c.trim()); }); });
    for (var i = 0; i < cumleler.length; i++) {
      var n = norm(cumleler[i]);
      if (terimler.every(function (t) { return n.indexOf(t) !== -1; })) return cumleler[i];
    }
    for (i = 0; i < cumleler.length; i++) {
      n = norm(cumleler[i]);
      if (terimler.some(function (t) { return n.indexOf(t) !== -1; })) return cumleler[i];
    }
    return ilkCumle(v.s);
  }

  function hazirla(veri) {

      KOMSU[b[0]].push({ r: b[1], yon: "out", id: b[2] });
      KOMSU[b[2]].push({ r: b[1], yon: "in", id: b[0] });
    });
    LISTE.forEach(function (v) { v._derece = KOMSU[v.id].length; });
    LISTE.sort(function (a, b) { return DONEM[a.e].sira - DONEM[b.e].sira || b._derece - a._derece; });
    var say = { f: 0, a: 0, k: 0 }; LISTE.forEach(function (v) { say[v.t]++; });
    $("stats").innerHTML = "<span><b>" + say.f + "</b> filozof</span><span><b>" + say.a + "</b> akım</span><span><b>" + say.k + "</b> kavram</span><span><b>" + veri.baglar.length + "</b> bağ</span>";
    var sel = $("era");
    sel.innerHTML = '<option value="">Tüm dönemler</option>' + DONEMLER.map(function (d) { return '<option value="' + d[0] + '">' + esc(d[1]) + " (" + esc(d[2]) + ")</option>"; }).join("");
  }

  function puanla(v, terimler) {
    var toplam = 0;
    for (var j = 0; j < terimler.length; j++) {
      var t = terimler[j], p = 0;
      if (v._ad === t) p = 100;
      else if (v._ad.indexOf(t) === 0) p = 80;
      else if (v._ad.indexOf(t) !== -1) p = 60;
      v._al.forEach(function (a) { p = Math.max(p, a === t ? 90 : a.indexOf(t) === 0 ? 70 : a.indexOf(t) !== -1 ? 50 : 0); });
      v._k.forEach(function (k) { p = Math.max(p, k === t ? 40 : k.indexOf(t) !== -1 ? 28 : 0); });
      if (!p && v._w.indexOf(t) !== -1) p = 15;
      if (!p && v._i.indexOf(t) !== -1) p = 14;
      if (!p && v._s.indexOf(t) !== -1) p = 12;
      if (!p) return 0;
      toplam += p;
    }
    // Tam ifade adla birebir eşleşirse en üste.
    var tum = terimler.join(" ");
    if (terimler.length > 1 && (v._ad === tum || v._al.indexOf(tum) !== -1)) toplam += 100;
    return toplam + Math.min(v._derece, 40) / 20;
  }

  function sonuclar() {
    var terimler = norm(durum.q).split(/\s+/).filter(function (t) { return t.length > 0; });
    var liste = LISTE.filter(function (v) { return (!durum.t || v.t === durum.t) && (!durum.e || v.e === durum.e); });
    if (!terimler.length) return { terimler: [], liste: liste.map(function (v) { return { v: v, p: 0 }; }) };
    var out = [];
    liste.forEach(function (v) { var p = puanla(v, terimler); if (p > 0) out.push({ v: v, p: p }); });
    out.sort(function (a, b) { return b.p - a.p; });
    return { terimler: terimler, liste: out };
  }

  function listeyiCiz() {
    var r = sonuclar(), ul = $("results");
    durum._son = r;
    var html = r.liste.slice(0, 200).map(function (x) {

      return '<li><button data-id="' + v.id + '"' + (durum.secili === v.id ? ' aria-current="true"' : "") + '>' +
        '<span class="r-top"><span class="dot ' + v.t + '" aria-hidden="true"></span><span class="r-name">' + (r.terimler.length ? isaretle(v.n, r.terimler) : esc(v.n)) + '</span>' +

  // ---------- Bağ haritası ----------
  function renk(t) { return t === "f" ? "var(--filozof)" : t === "a" ? "var(--akim)" : "var(--kavram)"; }
  function kenarStil(r) {
    var k = ILISKI[r][2];
    if (k === "catisma") return 'stroke="var(--catisma)" stroke-width="1.6" stroke-dasharray="5 4"';
    if (k === "ilgi") return 'stroke="var(--kavram)" stroke-width="1.6" stroke-dasharray="1.5 4" stroke-linecap="round"';
    if (k === "soy") return 'stroke="var(--muted)" stroke-width="1.5"';
    return 'stroke="var(--line)" stroke-width="1.4"';
  }
  function kisalt(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }

  function haritaCiz(dugumler, kenarlar, merkezId) {
    var W = 940, H = 600, cx = W / 2, cy = H / 2, poz = {};
    var digerleri = dugumler.filter(function (id) { return id !== merkezId; });
    digerleri.sort(function (a, b) {
      var va = V[a], vb = V[b], s = { a: 0, k: 1, f: 2 };
      return s[va.t] - s[vb.t] || DONEM[va.e].sira - DONEM[vb.e].sira;
    });
    var halka1 = digerleri, halka2 = [];
    if (digerleri.length > 22) { halka1 = digerleri.filter(function (_, i) { return i % 2 === 0; }); halka2 = digerleri.filter(function (_, i) { return i % 2 === 1; }); }
    function yerlestir(ids, rx, ry, kayma) {
      ids.forEach(function (id, i) {
        var a = -Math.PI / 2 + (i + kayma) / ids.length * Math.PI * 2;
        poz[id] = { x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry, a: a };
      });
    }
    if (merkezId) poz[merkezId] = { x: cx, y: cy, a: 0 };
    if (halka2.length) { yerlestir(halka1, 205, 175, 0); yerlestir(halka2, 300, 235, 0.5); }
    else yerlestir(halka1, merkezId ? 250 : 270, merkezId ? 205 : 220, 0);

    var svg = '<svg class="graph" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Bağ haritası">';
    kenarlar.forEach(function (k) {
      var a = poz[k[0]], b = poz[k[2]];
      if (!a || !b) return;
      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      var qx = mx + (cx - mx) * 0.25, qy = my + (cy - my) * 0.25;
      if (k[0] === merkezId || k[2] === merkezId) { qx = mx; qy = my; }
      svg += '<path class="edge" d="M' + a.x.toFixed(1) + " " + a.y.toFixed(1) + " Q" + qx.toFixed(1) + " " + qy.toFixed(1) + " " + b.x.toFixed(1) + " " + b.y.toFixed(1) + '" ' + kenarStil(k[1]) + '/>';
    });
    dugumler.forEach(function (id) {
      var p = poz[id], v = V[id]; if (!p) return;
      var merkez = id === merkezId, r = merkez ? 11 : 6.5;
      var etiket, ta = "middle", lx = p.x, ly = p.y;
      if (merkez) { ly = p.y - 18; etiket = '<text class="center-label" x="' + lx + '" y="' + ly + '" text-anchor="middle">' + esc(v.n) + "</text>"; }
      else {
        var c = Math.cos(p.a), s = Math.sin(p.a);
        if (Math.abs(c) < 0.12) { ly = s < 0 ? p.y - 12 : p.y + 22; }
        else if (c > 0) { ta = "start"; lx = p.x + 10; ly = p.y + 4 + (Math.abs(c) < 0.5 ? (s < 0 ? -6 : 6) : 0); }
        else { ta = "end"; lx = p.x - 10; ly = p.y + 4 + (Math.abs(c) < 0.5 ? (s < 0 ? -6 : 6) : 0); }
        etiket = '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + ta + '">' + esc(kisalt(v.n, 24)) + "</text>";

        '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + r + '" fill="' + renk(v.t) + '" stroke="var(--surface)" stroke-width="2"/>' + etiket + "</g>";

  var LEJANT = '<div class="legend"><span><span class="dot f"></span>Filozof</span><span><span class="dot a"></span>Akım</span><span><span class="dot k"></span>Kavram</span>' +

  // ---------- Görünümler ----------
  function chip(id, catisma) {

  function detayCiz(id) {
    var v = V[id], komsu = KOMSU[id];
    var gruplar = {};
    komsu.forEach(function (k) {
      var anahtar = k.r === "ilgili" ? "ilgili" : k.r + ":" + k.yon;

    var bagHtml = "";
    SIRA.forEach(function (r) {
      ["out", "in"].forEach(function (yon) {

        if (!ids) return;
        ids = ids.filter(function (x, i) { return ids.indexOf(x) === i; });
        ids.sort(function (a, b) { return DONEM[V[a].e].sira - DONEM[V[b].e].sira; });
        var baslik = ILISKI[r][yon === "out" ? 0 : 1];
        bagHtml += "<div><h4>" + esc(baslik) + ' <span class="hint">(' + ids.length + ")</span></h4><div class=\"row\">" + ids.map(function (x) { return chip(x, ILISKI[r][2] === "catisma"); }).join("") + "</div></div>";
      });
    });
    var dugumler = [id];
    komsu.forEach(function (k) { if (dugumler.indexOf(k.id) === -1) dugumler.push(k.id); });
    var kenarlar = komsu.map(function (k) { return k.yon === "out" ? [id, k.r, k.id] : [k.id, k.r, id]; });
    // Komşular arasındaki bağları da göster.

    dugumler.forEach(function (d) {
      if (d === id) return;

    });

    var facts = [];
    if (v.d) facts.push("<span>" + (v.t === "f" ? "Yaşam" : "Dönem") + ": <b>" + esc(v.d) + "</b></span>");
    if (v.r) facts.push("<span>Yer: <b>" + esc(v.r) + "</b></span>");
    facts.push("<span>Bağ sayısı: <b>" + komsu.length + "</b></span>");

    var terimler = durum.q ? norm(durum.q).split(/\s+/).filter(Boolean) : [];
    var hl = function (s) { return terimler.length ? isaretle(s, terimler) : esc(s); };

    $("main").innerHTML =
      '<article class="card">' +
      '<div class="eyebrow"><span class="dot ' + v.t + '"></span><span class="t-' + v.t + '">' + TUR[v.t] + "</span><span>·</span><span>" + esc(DONEM[v.e].ad) + "</span></div>" +
      '<h2 class="title">' + esc(v.n) + "</h2>" +
      (v.al && v.al.length ? '<p class="aliases">Diğer adları: ' + esc(v.al.join(", ")) + "</p>" : "") +
      '<div class="facts">' + facts.join("") + "</div>" +
      '<p class="summary">' + hl(v.s) + "</p>" +
      (v.o ? '<div class="core"><h3 class="sec">Temel düşünce</h3><p>' + hl(v.o) + "</p>" +
        (v.yn ? '<p class="yeni"><b>Getirdiği yenilik:</b> ' + hl(v.yn) + "</p>" : "") +
        '<a href="#soy-' + id + '">Soy ağacında gör: kimden etkilendi, kimi etkiledi →</a></div>' : "") +
      '<div class="cols"><section><h3 class="sec">' + (v.t === "k" ? "Ana hatlar" : "Ana fikirler") + '</h3><ul class="ideas">' + (v.i || []).map(function (x) { return "<li>" + hl(x) + "</li>"; }).join("") + "</ul>" +
      (v.w && v.w.length ? '<h3 class="sec" style="margin-top:22px">Başlıca eserler</h3><ul class="works">' + v.w.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "") +
      (v.k && v.k.length ? '<h3 class="sec" style="margin-top:22px">Anahtar kelimeler</h3><div class="filters">' + v.k.map(function (x) { return '<button class="chip" data-q="' + esc(x) + '">' + esc(x) + "</button>"; }).join("") + "</div>" : "") +
      '</section><section><h3 class="sec">Bağlar</h3><div class="links">' + (bagHtml || '<p class="hint">Bu kayıt için henüz bağ girilmedi.</p>') + "</div></section></div>" +
      '<div class="graph-box"><div class="graph-head"><h3 class="sec">Bağ haritası</h3>' + LEJANT + '</div><div class="graph-scroll">' + haritaCiz(dugumler, kenarlar, id) + "</div></div>" +
      "</article>";
  }

  function konuCiz(r) {
    var ust = r.liste.slice(0, 26).map(function (x) { return x.v.id; });
    var kume = {}; ust.forEach(function (id) { kume[id] = 1; });
    var kenarlar = [];
    ust.forEach(function (id) { KOMSU[id].forEach(function (k) { if (k.yon === "out" && kume[k.id]) kenarlar.push([id, k.r, k.id]); }); });
    var say = { f: 0, a: 0, k: 0 }; r.liste.forEach(function (x) { say[x.v.t]++; });
    var parca = ["f", "a", "k"].filter(function (t) { return say[t]; }).map(function (t) { return say[t] + " " + TUR_COGUL[t]; });
    var gruplar = ["k", "a", "f"].map(function (t) {

      if (!xs.length) return "";
      return '<section style="margin-top:22px"><h3 class="sec">' + { k: "Kavramlar", a: "Akımlar", f: "Filozoflar" }[t] + '</h3><div class="topic-list">' + xs.map(function (x) {

        return '<button data-id="' + v.id + '"><span class="r-top"><span class="dot ' + v.t + '"></span><span class="r-name">' + esc(v.n) + '</span><span class="r-meta">' + esc(DONEM[v.e].ad) + '</span></span><span class="r-snip">' + isaretle(eslesenCumle(v, r.terimler), r.terimler) + "</span></button>";

    $("main").innerHTML =
      '<article class="card"><div class="eyebrow"><span>Anahtar kelime özeti</span></div>' +
      '<h2 class="title">“' + esc(durum.q.trim()) + "”</h2>" +
      '<p class="topic-stats">Bu kelime ' + r.liste.length + " kayıtta geçiyor: " + parca.join(", ") + ". Aşağıda en ilgili kayıtlar ve aralarındaki bağlar var; birine tıklayınca ayrıntılı özeti açılır.</p>" +
      (ust.length > 1 ? '<div class="graph-box"><div class="graph-head"><h3 class="sec">Konu haritası</h3>' + LEJANT + '</div><div class="graph-scroll">' + haritaCiz(ust, kenarlar, null) + "</div></div>" : "") +
      gruplar + "</article>";
  }

  function genelCiz() {
    var html = DONEMLER.map(function (d) {
      var xs = LISTE.filter(function (v) { return v.e === d[0] && v.t !== "k"; });
      xs.sort(function (a, b) { return (a.t === "a") - (b.t === "a") || b._derece - a._derece; });
      return '<div class="era"><div><div class="era-name">' + esc(d[1]) + '</div><div class="era-range">' + esc(d[2]) + '</div></div><div class="row">' + xs.map(function (v) { return chip(v.id); }).join("") + "</div></div>";
    }).join("");
    $("main").innerHTML = '<article class="card overview"><h2>Felsefe tarihinin haritası</h2>' +
      "<p>Her dönemin filozofları ve akımları aşağıda. Bir isme tıklayınca özetini, ana fikirlerini ve kimi etkilediğini, kimden etkilendiğini, kimi eleştirdiğini gösteren bağ haritasını görürsünüz. Soldaki aramaya bir kavram yazarsanız (örneğin “özgürlük”), o fikrin geçtiği tüm kayıtları ve aralarındaki bağları tek bir özet sayfasında toplar.</p>" +

  // ---------- Soy ağacı ----------
  // Filozoflar doğum yılına göre dikey bir zaman ekseninde dizilir; soldaki yaylar "hoca" ve "etkiledi" bağlarıdır.
  // Bir düşünür seçilince öncülleri (kimden etkilendiği) ve ardılları (kimi etkilediği) kuşak kuşak vurgulanır.
  var SOY_R = { hoca: 1, etkiledi: 1 };
  var soy = { secili: null, yalniz: false, oz: true, donem: "", derin: 2, kok: null, ro: null };

  function yilYaz(y) { return y < 0 ? "MÖ " + (-y) : String(y); }
  function yuzyil(y) { return y < 0 ? "MÖ " + Math.ceil(-y / 100) + ". yüzyıl" : (Math.floor((y - 1) / 100) + 1) + ". yüzyıl"; }
  function soyBag(id, yon) {
    return KOMSU[id].filter(function (k) { return k.yon === yon && SOY_R[k.r] && V[k.id].t === "f"; });
  }
  function benzersiz(xs) { var g = {}; return xs.filter(function (k) { if (g[k.id]) return false; g[k.id] = 1; return true; }); }
  // Seçilen düşünürden yukarı (öncüller) ve aşağı (ardıllar) kuşak sayısıyla birlikte yürür.
  function soyHatti(id) {
    function yuru(yon) {
      var derin = {}, sira = [id]; derin[id] = 0;
      while (sira.length) {
        var x = sira.shift();
        if (derin[x] >= soy.derin) continue;
        soyBag(x, yon).forEach(function (k) { if (!(k.id in derin)) { derin[k.id] = derin[x] + 1; sira.push(k.id); } });
      }
      delete derin[id];
      return derin;
    }
    return { ust: yuru("in"), alt: yuru("out") };
  }
  function soyCips(ks, sinif) {
    if (!ks.length) return "";
    ks.sort(function (a, b) { return V[a.id].y - V[b.id].y; });
    return ks.map(function (k) {
      var c = sinif || (k.r === "hoca" ? "h" : "");
      return '<button class="sk-git' + (c ? " " + c : "") + '" data-sk-git="' + k.id + '"' + (k.r === "hoca" ? ' title="Hocası / öğrencisi"' : "") + ">" + esc(V[k.id].n) + "</button>";
    }).join("");
  }
  function soyKart(v) {
    var once = benzersiz(soyBag(v.id, "in")), sonra = benzersiz(soyBag(v.id, "out"));
    var elestiri = KOMSU[v.id].filter(function (k) { return k.yon === "out" && k.r === "elestirdi" && V[k.id].t === "f"; });
    var yeniKavram = KOMSU[v.id].filter(function (k) { return k.yon === "out" && (k.r === "gelistirdi" || k.r === "kurdu"); });
    return '<li class="sk" id="sk-' + v.id + '" data-sk="' + v.id + '">' +
      '<div class="sk-ust"><button class="sk-ad" data-sk-sec="' + v.id + '" aria-pressed="false">' + esc(v.n) + "</button>" +
      '<span class="sk-meta">' + esc(v.d || yilYaz(v.y)) + (v.r ? " · " + esc(v.r) : "") + "</span><span class=\"sk-rol\"></span></div>" +
      '<div class="sk-satir"><span class="sk-et">Etkilendiği</span><span class="sk-cips">' +
        (soyCips(once) || '<span class="yok">Kayıtlı öncülü yok; bu hattın başlangıcı</span>') + "</span></div>" +
      '<div class="sk-satir"><span class="sk-et">Yeni düşünce</span><span class="sk-yeni">' + esc(v.yn || "") +
        (yeniKavram.length ? ' <span class="sk-meta">(' + yeniKavram.map(function (k) { return esc(V[k.id].n); }).join(", ") + ")</span>" : "") + "</span></div>" +
      (v.o ? '<p class="sk-oz">' + esc(v.o) + "</p>" : "") +
      (sonra.length ? '<div class="sk-satir"><span class="sk-et">Etkiledikleri</span><span class="sk-cips">' + soyCips(sonra) + "</span></div>" : "") +
      (elestiri.length ? '<div class="sk-satir"><span class="sk-et">Eleştirdiği</span><span class="sk-cips">' + soyCips(elestiri, "c") + "</span></div>" : "") +
      '<button class="sk-detay" data-id="' + v.id + '">Ayrıntılı özet ve bağ haritası →</button>' +
      "</li>";
  }

  function soyCiz() {
    var fs = LISTE.filter(function (v) { return v.t === "f" && typeof v.y === "number"; });
    fs.sort(function (a, b) { return a.y - b.y || a.n.localeCompare(b.n, "tr"); });
    var secenek = fs.slice().sort(function (a, b) { return a.n.localeCompare(b.n, "tr"); })
      .map(function (v) { return '<option value="' + v.id + '">' + esc(v.n) + "</option>"; }).join("");
    $("main").innerHTML =
      '<article class="card soy-card"><h2>Düşünce soy ağacı</h2>' +
      "<p>Filozoflar doğum yıllarına göre yukarıdan aşağı dizili. Her kartta kimden etkilendiği, getirdiği yeni düşünce ve temel düşüncesi en fazla üç cümleyle yazılı. Soldaki yaylar etki ve hoca-öğrenci bağlarıdır. Bir düşünüre dokununca öncülleri ve ardılları kuşak kuşak vurgulanır.</p>" +
      '<div class="soy-bar">' +
        '<select id="soy-sec" aria-label="Düşünür seç"><option value="">Düşünür seç…</option>' + secenek + "</select>" +
        '<select id="soy-donem" aria-label="Dönem"><option value="">Tüm dönemler</option>' + DONEMLER.map(function (d) { return '<option value="' + d[0] + '">' + esc(d[1]) + "</option>"; }).join("") + "</select>" +
        '<select id="soy-derin" aria-label="Kaç kuşak vurgulansın"><option value="1">1 kuşak</option><option value="2">2 kuşak</option><option value="99">Tüm kuşaklar</option></select>' +
        '<button class="chip" id="soy-yalniz" aria-pressed="false" disabled>Yalnızca soy hattı</button>' +
        '<button class="chip" id="soy-oz" aria-pressed="true">Temel düşünceler</button>' +
      "</div>" +
      '<div class="soy-legend"><span><i></i>Etkiledi</span><span><i class="h"></i>Hocasıydı</span><span><i class="a"></i>Seçilenin öncülleri</span><span><i class="t"></i>Seçilenin ardılları</span></div>' +
      '<div class="soy-durum" id="soy-durum" aria-live="polite"></div>' +
      '<div class="soy" id="soy"><svg class="yaylar" id="yaylar" aria-hidden="true"></svg><ol class="sk-liste" id="sk-liste"></ol></div>' +
      "</article>";
    soy.kok = $("soy");
    soy.fs = fs;
    $("soy-donem").value = soy.donem;
    $("soy-derin").value = String(soy.derin);
    $("soy-derin").addEventListener("change", function (e) { soy.derin = +e.target.value; soyIsaretle(); });
    $("soy-oz").setAttribute("aria-pressed", soy.oz ? "true" : "false");
    soy.kok.classList.toggle("ozsuz", !soy.oz);
    soyListe();
    $("soy-sec").addEventListener("change", function (e) { if (e.target.value) soySec(e.target.value, true); else soySec(null); });
    $("soy-donem").addEventListener("change", function (e) { soy.donem = e.target.value; soyListe(); soyIsaretle(); });
    $("soy-yalniz").addEventListener("click", function () {
      soy.yalniz = !soy.yalniz; this.setAttribute("aria-pressed", soy.yalniz ? "true" : "false");
      soy.kok.classList.toggle("yalniz", soy.yalniz); yaylariCiz();
      if (soy.secili) kartaGit(soy.secili);
    });
    $("soy-oz").addEventListener("click", function () {
      soy.oz = !soy.oz; this.setAttribute("aria-pressed", soy.oz ? "true" : "false");
      soy.kok.classList.toggle("ozsuz", !soy.oz); yaylariCiz();
    });
    if (soy.ro) soy.ro.disconnect();
    if (window.ResizeObserver) { soy.ro = new ResizeObserver(function () { yaylariCiz(); }); soy.ro.observe($("sk-liste")); }
  }
  function soyListe() {
    var html = "", son = null;
    soy.fs.forEach(function (v) {
      if (soy.donem && v.e !== soy.donem) return;
      var yy = yuzyil(v.y);
      if (yy !== son) { html += '<li class="sk-yy" aria-hidden="true">' + yy + "</li>"; son = yy; }
      html += soyKart(v);
    });
    $("sk-liste").innerHTML = html;
  }
  // Seçime göre kartlara sınıf verir ve yayları yeniden çizer.
  function soyIsaretle() {
    var hat = soy.secili ? soyHatti(soy.secili) : { ust: {}, alt: {} };
    soy.hat = hat;
    soy.kok.classList.toggle("odak", !!soy.secili);
    soy.kok.classList.toggle("yalniz", !!soy.secili && soy.yalniz);
    $("soy-yalniz").disabled = !soy.secili;
    $("soy-sec").value = soy.secili || "";
    Array.prototype.forEach.call(soy.kok.querySelectorAll(".sk"), function (li) {
      var id = li.getAttribute("data-sk"), rol = "", sinif = "";
      if (id === soy.secili) { sinif = "sec"; rol = "Seçili"; }
      else if (id in hat.ust) { sinif = "ust"; rol = hat.ust[id] === 1 ? "Doğrudan öncül" : hat.ust[id] + ". kuşak öncül"; }
      else if (id in hat.alt) { sinif = "alt"; rol = hat.alt[id] === 1 ? "Doğrudan ardıl" : hat.alt[id] + ". kuşak ardıl"; }
      li.className = "sk" + (sinif ? " " + sinif + " in" : "");
      li.querySelector(".sk-rol").textContent = rol;
      li.querySelector(".sk-ad").setAttribute("aria-pressed", id === soy.secili ? "true" : "false");
    });
    // Yalnızca soy hattı gösterilirken boş kalan yüzyıl başlıklarını gizle.
    var baslik = null;
    Array.prototype.forEach.call(soy.kok.querySelectorAll(".sk-liste > li"), function (li) {
      if (li.classList.contains("sk-yy")) { baslik = li; li.classList.add("bos"); }
      else if (baslik && li.classList.contains("in")) baslik.classList.remove("bos");
    });
    var d = $("soy-durum");
    if (soy.secili) {
      var nu = Object.keys(hat.ust).length, na = Object.keys(hat.alt).length;
      var du = soyBag(soy.secili, "in").length, da = soyBag(soy.secili, "out").length;
      var kus = soy.derin > 50 ? "tüm kuşaklarda" : soy.derin + " kuşakta";
      var ek = function (n, dog) { return n > dog ? ", " + kus + " " + n : ""; };
      d.innerHTML = "<b>" + esc(V[soy.secili].n) + "</b>" +
        '<span><span class="ust">' + du + " doğrudan öncül</span>" + ek(nu, du) + '</span><span><span class="alt">' + da + " doğrudan ardıl</span>" + ek(na, da) + "</span>" +
        '<button class="sk-git" id="soy-temizle" aria-label="Seçimi kaldır">Seçimi kaldır ×</button>';
      $("soy-temizle").addEventListener("click", function () { soySec(null); });
    } else d.innerHTML = "";
    yaylariCiz();
  }
  function soySec(id, kaydir) {
    soy.secili = id && V[id] ? id : null;
    var h = soy.secili ? "#soy-" + soy.secili : "#soy";
    if (location.hash !== h) history.replaceState(null, "", location.pathname + location.search + h);
    document.title = soy.secili ? V[soy.secili].n + " · Soy ağacı · Sophidex" : "Soy ağacı · Sophidex";
    if (soy.secili && soy.donem && V[soy.secili].e !== soy.donem) { soy.donem = ""; $("soy-donem").value = ""; soyListe(); }
    soyIsaretle();
    if (soy.secili && kaydir) kartaGit(soy.secili);
  }
  function kartaGit(id) {
    var li = $("sk-" + id);
    if (li) li.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }
  function yaylariCiz() {
    var svg = $("yaylar"); if (!svg || !soy.kok) return;
    var g = soy.kok.querySelector(".sk-liste");
    var G = parseFloat(getComputedStyle(soy.kok).getPropertyValue("--g")) || 58;
    var H = g.offsetHeight, x0 = G - 6, poz = {};
    Array.prototype.forEach.call(g.querySelectorAll(".sk"), function (li) {
      if (li.offsetParent === null) return;
      poz[li.getAttribute("data-sk")] = li.offsetTop + 22;
    });
    // Öncül hattındaki yaylar "ust", ardıl hattındakiler "alt", seçilene doğrudan bağlananlar ayrıca "dog" sınıfı alır.
    var hat = soy.hat || { ust: {}, alt: {} }, sec = soy.secili;
    var normal = "", vurgu = "", olcek = Math.log(1 + H / 80) || 1;
    Object.keys(poz).forEach(function (a) {
      soyBag(a, "out").forEach(function (k) {
        var b = k.id; if (!(b in poz) || a === b) return;
        var y1 = poz[a], y2 = poz[b], dy = Math.abs(y2 - y1);
        var w = (G - 10) * Math.min(1, Math.log(1 + dy / 80) / olcek) + 4, c = x0 - w * 4 / 3;
        var sinif = "yay" + (k.r === "hoca" ? " h" : ""), one = false;
        if (sec) {
          if (a in hat.ust && (b === sec || b in hat.ust)) { sinif += " ust"; one = true; }
          else if (b in hat.alt && (a === sec || a in hat.alt)) { sinif += " alt"; one = true; }
          if (one && (a === sec || b === sec)) sinif += " dog";
        }
        var p = '<path class="' + sinif + '" d="M' + x0 + " " + y1 + " C" + c.toFixed(1) + " " + y1 + " " + c.toFixed(1) + " " + y2 + " " + x0 + " " + y2 + '"/>';
        if (one) vurgu += p; else normal += p;
      });
    });
    var noktalar = "";
    Object.keys(poz).forEach(function (id) {
      var ic = id === sec || id in hat.ust || id in hat.alt;
      noktalar += '<circle cx="' + x0 + '" cy="' + poz[id] + '" r="' + (id === sec ? 6 : 4) + '"' + (ic ? ' class="in' + (id === sec ? " sec" : "") + '"' : "") + "/>";
    });
    svg.setAttribute("height", H);
    svg.setAttribute("viewBox", "0 0 " + G + " " + H);
    svg.style.height = H + "px";
    svg.innerHTML = normal + vurgu + noktalar;
  }
  function soyGoster(id) {
    document.body.classList.add("soy-modu");
    if (!soy.kok || !document.body.contains(soy.kok)) soyCiz();
    soySec(id, !!id);
  }

  // ---------- Yönlendirme ----------
  function goster() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ""));
    var soyModu = h === "soy" || h.indexOf("soy-") === 0;
    $("v-soy").setAttribute("aria-current", soyModu ? "page" : "false");
    $("v-atlas").setAttribute("aria-current", soyModu ? "false" : "page");
    if (soyModu) { durum.secili = null; soyGoster(h.slice(4) || null); return; }
    document.body.classList.remove("soy-modu");
    if (soy.ro) { soy.ro.disconnect(); soy.ro = null; }
    soy.kok = null;
    var id = h.indexOf("e-") === 0 ? h.slice(2) : null;
    if (id && V[id]) { durum.secili = id; detayCiz(id); }
    else if (durum.q.trim() && durum._son && durum._son.liste.length) {
      durum.secili = null;
      var ilk = durum._son.liste[0];
      if (ilk.p >= 50 && (durum._son.liste.length === 1 || ilk.p > durum._son.liste[1].p + 20)) { durum.secili = ilk.v.id; detayCiz(ilk.v.id); }
      else konuCiz(durum._son);
    } else { durum.secili = null; genelCiz(); }
    Array.prototype.forEach.call($("results").querySelectorAll("button[data-id]"), function (b) {
      if (b.getAttribute("data-id") === durum.secili) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    });
    document.title = durum.secili ? V[durum.secili].n + " · Sophidex" : "Sophidex";
  }
  function ac(id) {
    if (location.hash === "#e-" + id) goster(); else location.hash = "e-" + id;
    if (window.matchMedia("(max-width: 820px)").matches) $("main").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function aramaYap(q) {
    durum.q = q; $("q").value = q; listeyiCiz();
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    goster();
  }

  // ---------- Olaylar ----------
  var zaman;
  $("q").addEventListener("input", function (e) {
    clearTimeout(zaman);
    var q = e.target.value;
    zaman = setTimeout(function () { aramaYap(q); }, 120);
  });
  $("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && durum._son && durum._son.liste.length) { e.preventDefault(); ac(durum._son.liste[0].v.id); }
    if (e.key === "Escape") aramaYap("");
  });
  $("clear").addEventListener("click", function () { aramaYap(""); $("q").focus(); });
  document.querySelectorAll(".filters[role=group] .chip").forEach(function (b) {
    b.addEventListener("click", function () {
      durum.t = b.getAttribute("data-t");
      document.querySelectorAll(".filters[role=group] .chip").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      listeyiCiz(); if (!location.hash) goster();
    });
  });
  $("era").addEventListener("change", function (e) { durum.e = e.target.value; listeyiCiz(); if (!location.hash) goster(); });
  $("home").addEventListener("click", function () { aramaYap(""); });
  $("v-atlas").addEventListener("click", function (e) {
    e.preventDefault();
    if (location.hash) history.pushState(null, "", location.pathname + location.search);
    goster();
  });
  $("home").addEventListener("keydown", function (e) { if (e.key === "Enter") aramaYap(""); });
  document.addEventListener("click", function (e) {
    var git = e.target.closest("[data-sk-git]");
    if (git) { e.preventDefault(); soySec(git.getAttribute("data-sk-git"), true); return; }
    var kart = e.target.closest("[data-sk]");
    if (kart && !e.target.closest("[data-id]")) { soySec(kart.getAttribute("data-sk"), false); return; }
    var b = e.target.closest("[data-id]");
    if (b) { e.preventDefault(); ac(b.getAttribute("data-id")); return; }
    var q = e.target.closest("[data-q]");
    if (q) { e.preventDefault(); aramaYap(q.getAttribute("data-q")); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.classList && e.target.classList.contains("node")) ac(e.target.getAttribute("data-id"));
    if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  });
  window.addEventListener("hashchange", goster);
  window.addEventListener("popstate", goster);

  fetch("veri.json").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (veri) {
    hazirla(veri); listeyiCiz(); goster();
  }).catch(function () {
    $("main").innerHTML = '<div class="card"><p>Veri dosyası (veri.json) yüklenemedi. Sayfayı yenileyin; sorun sürerse dosyanın sayfayla aynı klasörde olduğundan emin olun.</p></div>';
    $("stats").textContent = "";
  });
})();
</script>
<script>
// Çevrimdışı çalışma: yalnızca kendi alan adında (ör. GitHub Pages) servis çalışanını kaydet.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
}
</script>
